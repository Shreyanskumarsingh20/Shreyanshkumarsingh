name: IndexNow

# Vercel reports each deployment back to GitHub. When a Production deploy
# succeeds, tell IndexNow (Bing & co.) which pages changed.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in the sitemap"
        type: boolean
        default: false

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit changed URLs
        run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
